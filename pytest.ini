[pytest]
minversion = 7.0
addopts = -ra -m "not integration" --strict-markers --strict-config --cov=domainiq --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=100
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests as integration tests requiring API key
